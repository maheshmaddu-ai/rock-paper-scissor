<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
    }

    .game {
      width: 420px;
      padding: 35px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-bottom: 25px;
    }

    .score {
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
      font-size: 20px;
    }

    .score span {
      display: block;
      font-size: 32px;
      font-weight: bold;
      margin-top: 5px;
    }

    .result {
      min-height: 60px;
      margin-bottom: 25px;
      font-size: 18px;
      font-weight: bold;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .choice {
      border: none;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      font-size: 40px;
      cursor: pointer;
      background: white;
      transition: 0.25s;
    }

    .choice:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .reset {
      margin-top: 30px;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background: #ff4757;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .reset:hover {
      background: #ff6b81;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>Rock Paper Scissors</h1>

    <div class="score">
      <div>
        You
        <span id="playerScore">0</span>
      </div>

      <div>
        Computer
        <span id="computerScore">0</span>
      </div>
    </div>

    <div class="result" id="result">
      Choose your move!
    </div>

    <div class="choices">
      <button class="choice" onclick="playGame('rock')">✊</button>
      <button class="choice" onclick="playGame('paper')">✋</button>
      <button class="choice" onclick="playGame('scissors')">✌️</button>
    </div>

    <button class="reset" onclick="resetGame()">Reset Game</button>
  </div>

  <script>
    let playerScore = 0;
    let computerScore = 0;

    const choices = ["rock", "paper", "scissors"];

    function playGame(playerChoice) {
      const computerChoice =
        choices[Math.floor(Math.random() * choices.length)];

      let message = "";

      if (playerChoice === computerChoice) {
        message = `Draw! Both chose ${computerChoice}.`;
      } 
      else if (
        (playerChoice === "rock" && computerChoice === "scissors") ||
        (playerChoice === "paper" && computerChoice === "rock") ||
        (playerChoice === "scissors" && computerChoice === "paper")
      ) {
        playerScore++;
        message = `You win! ${capitalize(playerChoice)} beats ${computerChoice}.`;
      } 
      else {
        computerScore++;
        message = `Computer wins! ${capitalize(computerChoice)} beats ${playerChoice}.`;
      }

      document.getElementById("playerScore").textContent = playerScore;
      document.getElementById("computerScore").textContent = computerScore;
      document.getElementById("result").textContent = message;
    }

    function resetGame() {
      playerScore = 0;
      computerScore = 0;

      document.getElementById("playerScore").textContent = 0;
      document.getElementById("computerScore").textContent = 0;
      document.getElementById("result").textContent = "Choose your move!";
    }

    function capitalize(word) {
      return word.charAt(0).toUpperCase() + word.slice(1);
    }
  </script>

</body>
</html>
